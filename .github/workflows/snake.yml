name: Generate contribution snake

on:
  schedule:
    - cron: "30 1 * * *"
  push:
    paths:
      - "README.md"
      - ".github/workflows/snake.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate snake assets
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#c6a0f6&color_dots=#6e738d,#8bd5ca,#a6da95,#eed49f,#f5a97f&color_dot_border=#494d64
            dist/github-snake-dark.svg?color_snake=#c6a0f6&color_dots=#6e738d,#8bd5ca,#a6da95,#eed49f,#f5a97f&color_dot_border=#494d64

      - name: Add Macchiato background
        run: |
          python3 - <<'PY'
          import re
          for f in ("dist/github-snake.svg", "dist/github-snake-dark.svg"):
              svg = open(f).read()
              x, y, w, h = re.search(r'viewBox="([^"]+)"', svg).group(1).split()
              rect = f'<rect x="{x}" y="{y}" width="{w}" height="{h}" rx="12" fill="#24273a"/>'
              svg = re.sub(r'(<svg[^>]*>)', lambda m: m.group(1) + rect, svg, count=1)
              open(f, "w").write(svg)
          PY

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
