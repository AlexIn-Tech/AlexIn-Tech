name: Generate contribution snake

on:
  schedule:
    - cron: "30 1 * * *"
  push:
    paths:
      - "README.md"
      - ".github/workflows/snake.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate snake assets
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#8839ef&color_dots=#bcc0cc,#179299,#40a02b,#df8e1d,#d20f39&color_dot_border=#9ca0b0
            dist/github-snake-dark.svg?color_snake=#c6a0f6&color_dots=#494d64,#8bd5ca,#a6da95,#eed49f,#f5a97f&color_dot_border=#5b6078

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
